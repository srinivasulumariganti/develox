  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader

  <script>
    window.dietSpeech = {
      recognition: null,
      isListening: false,
      startRecognition: function(lang, onResult, onError, onEnd) {
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError("Microphone speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          return;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e){}
          }
          var rec = new SpeechRec();
          rec.lang = lang || 'en-IN';
          rec.continuous = false;
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          rec.onresult = function(event) {
            if (event.results && event.results.length > 0 && event.results[0].length > 0) {
              var text = event.results[0][0].transcript;
              if (onResult) onResult(text);
            }
          };
          rec.onerror = function(event) {
            var err = event.error || "Speech recognition error";
            if (err === 'not-allowed' || err === 'permission-denied') {
              err = "Microphone access was denied. Please allow microphone permission in your browser address bar.";
            } else if (err === 'no-speech') {
              err = "No speech detected. Please tap mic and speak clearly.";
            } else if (err === 'network') {
              err = "Network error during speech recognition. Please check your internet connection.";
            }
            if (onError) onError(err);
          };
          rec.onend = function() {
            window.dietSpeech.isListening = false;
            if (onEnd) onEnd();
          };
          rec.start();
          this.recognition = rec;
          this.isListening = true;
        } catch(e) {
          this.isListening = false;
          if (onError) onError(e.message || "Failed to start microphone. Please check browser permissions.");
        }
      },
      stopRecognition: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e){}
          this.isListening = false;
        }
      },
      speak: function(text, lang, onEnd) {
        if (!window.speechSynthesis) return;
        try { window.speechSynthesis.cancel(); } catch(e){}
        // Strip ALL emojis and markdown formatting so TTS engine NEVER speaks emojis
        var clean = text
          .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{FE00}-\u{FE0F}]/gu, '')
          .replace(/[|•*#`~_>]/g, ' ')
          .replace(/[-]{2,}/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        var utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = lang || 'en-IN';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.onend = function() {
          if (onEnd) {
            try { onEnd(); } catch(e){}
          }
        };
        utterance.onerror = function() {
          if (onEnd) {
            try { onEnd(); } catch(e){}
          }
        };
        window.speechSynthesis.speak(utterance);
      },
      stopSpeaking: function() {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      }
    };

    // Global top-level bindings for direct JS interop
    window.dietStartRecognition = function(lang, onResult, onError, onEnd) {
      window.dietSpeech.startRecognition(lang, onResult, onError, onEnd);
    };
    window.dietStopRecognition = function() {
      window.dietSpeech.stopRecognition();
    };
    window.dietSpeak = function(text, lang, onEnd) {
      window.dietSpeech.speak(text, lang, onEnd);
    };
    window.dietStopSpeaking = function() {
      window.dietSpeech.stopSpeaking();
    };

    // Also alias dotted properties so any lookup style succeeds
    window['dietSpeech.startRecognition'] = window.dietStartRecognition;
    window['dietSpeech.stopRecognition'] = window.dietStopRecognition;
    window['dietSpeech.speak'] = window.dietSpeak;
    window['dietSpeech.stopSpeaking'] = window.dietStopSpeaking;

    // Doctor's Diet Web Alarm & Reminder Engine (PWA & Web)
    window.dietAlarm = {
      _timers: {},
      _audioCtx: null,
      _audioUnlocked: false,
      _heartbeatStarted: false,
      _swReg: null,
      _swPromise: null,
      _swListenerAttached: false,
      _ringTimer: null,
      _ringCycles: 0,
      _activeAlert: null,

      _ensureSw: function() {
        var self = this;
        if (!('serviceWorker' in navigator)) {
          return Promise.resolve(null);
        }
        if (!this._swListenerAttached) {
          this._swListenerAttached = true;
          navigator.serviceWorker.addEventListener('message', function(event) {
            var msg = event && event.data ? event.data : {};
            if (msg.type === 'STOP_ALARM') {
              self.stopRinging();
            } else if (msg.type === 'SNOOZE_ALARM') {
              self.snoozeAlarm(msg.title || 'Meal Reminder', msg.minutes || 5);
            }
          });
        }
        if (this._swReg && this._swReg.active) {
          return Promise.resolve(this._swReg);
        }
        if (!this._swPromise) {
          var waitForActive = function(reg) {
            if (!reg) return Promise.resolve(null);
            if (reg.active) {
              self._swReg = reg;
              return Promise.resolve(reg);
            }
            var sw = reg.installing || reg.waiting;
            if (!sw) {
              self._swReg = reg;
              return Promise.resolve(reg);
            }
            return new Promise(function(resolve) {
              var done = false;
              var finish = function() {
                if (done) return;
                done = true;
                self._swReg = reg;
                resolve(reg);
              };
              sw.addEventListener('statechange', function() {
                if (sw.state === 'activated' || reg.active) finish();
              });
              setTimeout(finish, 900);
            });
          };
          this._swPromise = navigator.serviceWorker.register('pwa_sw.js', { scope: './' })
            .then(waitForActive)
            .catch(function() {
              return navigator.serviceWorker.getRegistration('./').then(waitForActive).catch(function() {
                return null;
              });
            });
        }
        return this._swPromise;
      },

      _unlockAudioHandlers: function() {
        if (this._audioUnlocked) return;
        this._audioUnlocked = true;
        var self = this;
        var unlock = function() {
          self._initAudio();
        };
        document.addEventListener('pointerdown', unlock, { once: true, passive: true });
        document.addEventListener('keydown', unlock, { once: true, passive: true });
      },

      _initAudio: function() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (!this._audioCtx) {
              this._audioCtx = new AudioCtx();
            }
            if (this._audioCtx.state === 'suspended') {
              this._audioCtx.resume();
            }
          }
        } catch(e) {}
      },

      requestPermission: async function() {
        this._ensureSw();
        this._initAudio();
        if (!("Notification" in window)) return 'unsupported';
        try {
          var perm = Notification.permission;
          if (perm === 'default') {
            perm = await Notification.requestPermission();
          }
          return perm;
        } catch(e) {
          return 'denied';
        }
      },

      getPermissionState: function() {
        if (!("Notification" in window)) return 'unsupported';
        try {
          return Notification.permission || 'default';
        } catch(e) {
          return 'denied';
        }
      },

      _localDateKey: function(ms) {
        var d = new Date(ms || Date.now());
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
      },

      _format12h: function(h, m) {
        var ampm = h >= 12 ? 'PM' : 'AM';
        var h12 = h % 12;
        if (h12 === 0) h12 = 12;
        return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
      },

      playChime: function(type) {
        try {
          this._initAudio();
          var ctx = this._audioCtx;
          if (!ctx) return;
          if (ctx.state === 'suspended' && ctx.resume) {
            ctx.resume().catch(function() {});
          }
          var now = ctx.currentTime;
          var notes = type === 'water'
            ? [587.33, 880.00, 1174.66]
            : [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = type === 'water' ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.14);
            gain.gain.setValueAtTime(0.001, now + i * 0.14);
            gain.gain.linearRampToValueAtTime(0.45, now + i * 0.14 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.14);
            osc.stop(now + i * 0.14 + 0.52);
          });
        } catch(e) {
          console.warn('Diet alarm audio chime notice:', e);
        }
      },

      _showAlarmBanner: function(type, title, subtitle) {
        try {
          var existing = document.getElementById('diet-pwa-alarm-banner');
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }
          var self = this;
          var wrap = document.createElement('div');
          wrap.id = 'diet-pwa-alarm-banner';
          wrap.setAttribute('role', 'alert');
          wrap.style.cssText = 'position:fixed;top:14px;right:14px;z-index:999999;width:min(370px,calc(100vw - 24px));background:#FFFFFF;border:1.5px solid #A7F3D0;border-radius:16px;box-shadow:0 16px 36px rgba(15,23,42,0.18);padding:14px 16px;font-family:Roboto,sans-serif;color:#0F172A;display:flex;flex-direction:column;gap:10px;';

          var header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;gap:10px;';

          var iconBox = document.createElement('div');
          iconBox.style.cssText = 'width:38px;height:38px;border-radius:12px;background:#ECFDF5;border:1px solid #A7F3D0;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;';
          iconBox.textContent = type === 'water' ? '💧' : '⏰';

          var textCol = document.createElement('div');
          textCol.style.cssText = 'flex:1;min-width:0;';

          var titleEl = document.createElement('div');
          titleEl.style.cssText = 'font-size:14px;font-weight:700;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
          titleEl.textContent = title;

          var subEl = document.createElement('div');
          subEl.style.cssText = 'font-size:12px;color:#475569;margin-top:2px;';
          subEl.textContent = subtitle;

          textCol.appendChild(titleEl);
          textCol.appendChild(subEl);
          header.appendChild(iconBox);
          header.appendChild(textCol);

          var btnRow = document.createElement('div');
          btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';

          var snoozeBtn = document.createElement('button');
          snoozeBtn.type = 'button';
          snoozeBtn.textContent = 'Snooze 5m';
          snoozeBtn.style.cssText = 'border:1px solid #CBD5E1;background:#F8FAFC;color:#0F172A;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;';
          snoozeBtn.onclick = function() {
            self.snoozeAlarm(title, 5);
          };

          var dismissBtn = document.createElement('button');
          dismissBtn.type = 'button';
          dismissBtn.textContent = 'Dismiss';
          dismissBtn.style.cssText = 'border:none;background:#059669;color:#FFFFFF;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;';
          dismissBtn.onclick = function() {
            self.stopRinging();
          };

          btnRow.appendChild(snoozeBtn);
          btnRow.appendChild(dismissBtn);
          wrap.appendChild(header);
          wrap.appendChild(btnRow);
          document.body.appendChild(wrap);
        } catch(e) {}
      },

      startRinging: function(type, title, subtitle) {
        this.stopRinging();
        var self = this;
        this._activeAlert = { type: type, title: title };
        this._ringCycles = 0;
        this.playChime(type);
        this._showAlarmBanner(type, title, subtitle);
        this._ringTimer = setInterval(function() {
          self._ringCycles++;
          if (self._ringCycles >= 10) {
            clearInterval(self._ringTimer);
            self._ringTimer = null;
            return;
          }
          self.playChime(type);
        }, 2600);
      },

      stopRinging: function() {
        if (this._ringTimer) {
          clearInterval(this._ringTimer);
          this._ringTimer = null;
        }
        this._activeAlert = null;
        try {
          var el = document.getElementById('diet-pwa-alarm-banner');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        } catch(e) {}
      },

      snoozeAlarm: function(title, minutes) {
        this.stopRinging();
        var mins = parseInt(minutes, 10) || 5;
        var snoozeMs = Date.now() + mins * 60000;
        var d = new Date(snoozeMs);
        var list = this._getSavedAlarms().filter(function(a) {
          return a && !(a.isSnooze && a.title === title);
        });
        list.push({
          title: title,
          hour: d.getHours(),
          minute: d.getMinutes(),
          targetTime: snoozeMs,
          lastFired: null,
          isSnooze: true
        });
        this._saveAlarms(list);
        this.showNotification(
          "⏰ Doctor's Diet: Snoozed",
          "Will remind you again for " + title + " in " + mins + " minutes."
        );
        this._setupHeartbeat();
      },

      showNotification: function(title, body, meta) {
        try {
          if (!("Notification" in window) || Notification.permission !== "granted") {
            return false;
          }
          var baseOptions = {
            body: body,
            icon: 'icons/Icon-192.png',
            badge: 'icons/Icon-192.png',
            vibrate: [300, 150, 300, 150, 300],
            tag: 'diet-' + Date.now(),
            renotify: true,
            requireInteraction: true,
            data: meta || {}
          };
          var swOptions = Object.assign({}, baseOptions);
          if (meta && meta.isAlert) {
            swOptions.actions = [
              { action: 'snooze', title: 'Snooze 5m' },
              { action: 'dismiss', title: 'Dismiss' }
            ];
          }
          var fallbackDirect = function() {
            try { new Notification(title, baseOptions); } catch(_) {}
          };
          var timeoutPromise = new Promise(function(resolve) {
            setTimeout(function() { resolve(null); }, 1500);
          });
          Promise.race([this._ensureSw(), timeoutPromise]).then(function(reg) {
            if (reg && reg.active && typeof reg.showNotification === 'function') {
              reg.showNotification(title, swOptions).catch(function() {
                reg.showNotification(title, baseOptions).catch(fallbackDirect);
              });
            } else {
              fallbackDirect();
            }
          }).catch(fallbackDirect);
          return true;
        } catch(e) {
          console.warn('Diet notification error:', e);
          return false;
        }
      },

      _getSavedAlarms: function() {
        try {
          var raw = localStorage.getItem('diet_saved_alarms');
          return raw ? JSON.parse(raw) : [];
        } catch(e) { return []; }
      },

      _saveAlarms: function(list) {
        try {
          localStorage.setItem('diet_saved_alarms', JSON.stringify(list));
        } catch(e) {}
      },

      _targetDate: function(hour, minute, dateKey) {
        var now = new Date();
        var h = parseInt(hour, 10);
        var m = parseInt(minute, 10);
        var target;
        if (dateKey && /^\d{4}-\d{2}-\d{2}$/.test(dateKey)) {
          var parts = dateKey.split('-');
          target = new Date(
            parseInt(parts[0], 10),
            parseInt(parts[1], 10) - 1,
            parseInt(parts[2], 10),
            h,
            m,
            0,
            0
          );
        } else {
          target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
        }
        while (target.getTime() <= now.getTime()) {
          target.setDate(target.getDate() + 1);
        }
        return target;
      },

      _nextOccurrenceMs: function(hour, minute, afterMs) {
        var d = new Date(afterMs);
        d.setHours(parseInt(hour, 10), parseInt(minute, 10), 0, 0);
        while (d.getTime() <= afterMs) {
          d.setDate(d.getDate() + 1);
        }
        return d.getTime();
      },

      scheduleAlarm: function(title, hour, minute, dateKey) {
        if (this.getPermissionState() !== 'granted') {
          return false;
        }
        var h = parseInt(hour, 10);
        var m = parseInt(minute, 10);
        this._initAudio();
        this.playChime('meal');

        var target = this._targetDate(h, m, dateKey);
        var isToday = this._localDateKey(target.getTime()) === this._localDateKey(Date.now());
        var whenText = (isToday ? 'Today at ' : 'Tomorrow at ') + this._format12h(h, m);
        this.showNotification(
          "⏰ Doctor's Diet: Alarm Set",
          "Scheduled for " + title + " (" + whenText + "). Keep this PWA open for alerts."
        );

        var list = this._getSavedAlarms().filter(function(a) {
          return a && !( !a.isSnooze && a.title === title );
        });
        list.push({
          title: title,
          hour: h,
          minute: m,
          targetTime: target.getTime(),
          lastFired: null,
          isSnooze: false
        });
        this._saveAlarms(list);

        this._setupHeartbeat();
        return true;
      },

      cancelAlarm: function(title) {
        try {
          var list = this._getSavedAlarms().filter(function(a) { return a && a.title !== title; });
          this._saveAlarms(list);
          return true;
        } catch(e) {
          return false;
        }
      },

      scheduleTimer: function(seconds, title) {
        if (this.getPermissionState() !== 'granted') {
          return false;
        }
        this._initAudio();
        this.playChime('water');
        var sec = parseInt(seconds, 10) || 7200;
        var everyText = sec < 3600
          ? Math.max(1, Math.round(sec / 60)) + " minutes"
          : Math.round(sec / 3600) + " hours";
        this.showNotification(
          "💧 Doctor's Diet: Water Reminder Active",
          "Hydration timer started for every " + everyText + " while this PWA is open."
        );

        try {
          localStorage.setItem('diet_water_reminder', JSON.stringify({
            title: title || 'Drink Water',
            intervalSeconds: sec,
            nextTriggerTime: Date.now() + sec * 1000
          }));
        } catch(e) {
          return false;
        }

        this._setupHeartbeat();
        return true;
      },

      cancelWaterReminder: function() {
        try {
          localStorage.removeItem('diet_water_reminder');
          return true;
        } catch(e) {
          return false;
        }
      },

      _setupHeartbeat: function() {
        this._ensureSw();
        this._unlockAudioHandlers();
        if (this._heartbeatStarted) return;
        this._heartbeatStarted = true;
        var self = this;
        var lateWindowMs = 30 * 60 * 1000;
        var checkAlarms = function() {
          var now = Date.now();
          var list = self._getSavedAlarms();
          var remaining = [];
          list.forEach(function(item) {
            if (!item || !item.targetTime) {
              if (item) remaining.push(item);
              return;
            }
            var diff = now - item.targetTime;
            if (diff >= 0) {
              var h = (typeof item.hour === 'number') ? item.hour : new Date(item.targetTime).getHours();
              var m = (typeof item.minute === 'number') ? item.minute : new Date(item.targetTime).getMinutes();
              var occDateKey = self._localDateKey(item.targetTime);
              if (diff <= lateWindowMs && item.lastFired !== occDateKey) {
                var lateNote = diff > 60000
                  ? " (late by " + Math.round(diff / 60000) + " min)"
                  : "";
                var subtitle = "Scheduled for " + self._format12h(h, m) + lateNote + " — time for your " + item.title + "!";
                self.startRinging('meal', item.title, subtitle);
                self.showNotification(
                  "⏰ Doctor's Diet: " + item.title + lateNote,
                  "Time for your scheduled " + item.title + "! Eat healthy and stay consistent.",
                  { isAlert: true, alarmType: 'meal', title: item.title }
                );
                item.lastFired = occDateKey;
              }
              if (!item.isSnooze) {
                item.targetTime = self._nextOccurrenceMs(h, m, now);
                remaining.push(item);
              }
            } else {
              remaining.push(item);
            }
          });
          self._saveAlarms(remaining);

          try {
            var raw = localStorage.getItem('diet_water_reminder');
            if (raw) {
              var w = JSON.parse(raw);
              if (w && w.nextTriggerTime && now >= w.nextTriggerTime) {
                self.startRinging('water', 'Drink Water', 'Hydration reminder — drink a fresh glass of water now!');
                self.showNotification(
                  "💧 Doctor's Diet: Hydration Reminder",
                  "Drink a fresh glass of water now to maintain energy and support metabolism!",
                  { isAlert: true, alarmType: 'water', title: w.title || 'Drink Water' }
                );
                w.nextTriggerTime = now + (w.intervalSeconds || 7200) * 1000;
                localStorage.setItem('diet_water_reminder', JSON.stringify(w));
              }
            }
          } catch(e) {}
        };

        setInterval(checkAlarms, 2000);
        window.addEventListener('focus', checkAlarms);
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkAlarms();
          }
        });
        setTimeout(checkAlarms, 500);
      },

      openCalendar: function(title, hour, minute, dateKey) {
        try {
          var start = this._targetDate(hour, minute, dateKey);
          var end = new Date(start.getTime() + 15 * 60000);
          function fmt(d) {
            return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
          }
          var url = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
            "&text=" + encodeURIComponent("Doctor's Diet: " + title) +
            "&dates=" + fmt(start) + "/" + fmt(end) +
            "&details=" + encodeURIComponent("Personalized diet meal reminder from Doctor's Diet AI app.");
          window.open(url, '_blank');
        } catch(e) {}
      },

      downloadIcsAlarm: function(title, hour, minute, dateKey) {
        try {
          var now = new Date();
          var start = this._targetDate(hour, minute, dateKey);
          var end = new Date(start.getTime() + 15 * 60000);
          function fmt(d) {
            return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
          }
          var icsContent = "BEGIN:VCALENDAR\r\n" +
            "VERSION:2.0\r\n" +
            "PRODID:-//Doctor's Diet AI//Meal Reminder//EN\r\n" +
            "BEGIN:VEVENT\r\n" +
            "UID:diet-alarm-" + Date.now() + "@doctorsdiet.ai\r\n" +
            "DTSTAMP:" + fmt(now) + "\r\n" +
            "DTSTART:" + fmt(start) + "\r\n" +
            "DTEND:" + fmt(end) + "\r\n" +
            "SUMMARY:⏰ Doctor's Diet: " + title + "\r\n" +
            "DESCRIPTION:Meal reminder from Doctor's Diet AI application.\r\n" +
            "BEGIN:VALARM\r\n" +
            "TRIGGER:-PT0M\r\n" +
            "ACTION:DISPLAY\r\n" +
            "DESCRIPTION:Doctor's Diet: " + title + "\r\n" +
            "END:VALARM\r\n" +
            "END:VEVENT\r\n" +
            "END:VCALENDAR\r\n";
          var blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
          var link = document.createElement('a');
          link.href = window.URL.createObjectURL(blob);
          link.setAttribute('download', 'diet_reminder_' + title.toLowerCase().replace(/[^a-z0-9]/g, '_') + '.ics');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          return true;
        } catch(e) {
          return false;
        }
      }
    };

    // Auto-resume heartbeat for background / persistent alarms
    window.dietAlarm._setupHeartbeat();

    window.dietScheduleAlarm = function(title, hour, minute, dateKey) {
      return window.dietAlarm.scheduleAlarm(title, hour, minute, dateKey);
    };
    window.dietCancelAlarm = function(title) {
      return window.dietAlarm.cancelAlarm(title);
    };
    window.dietScheduleTimer = function(seconds, title) {
      return window.dietAlarm.scheduleTimer(seconds, title);
    };
    window.dietCancelWaterReminder = function() {
      return window.dietAlarm.cancelWaterReminder();
    };
    window.dietRequestAlarmPermission = function() {
      return window.dietAlarm.requestPermission();
    };
    window.dietGetAlarmPermission = function() {
      return window.dietAlarm.getPermissionState();
    };
    window.dietOpenCalendar = function(title, hour, minute, dateKey) {
      return window.dietAlarm.openCalendar(title, hour, minute, dateKey);
    };
    window.dietDownloadIcsAlarm = function(title, hour, minute, dateKey) {
      return window.dietAlarm.downloadIcsAlarm(title, hour, minute, dateKey);
    };


    // Smoothly remove loading screen on first Flutter frame or fallback timeout
    function hideLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingScreen);
    // Safety fallback in case event is missed
    setTimeout(hideLoadingScreen, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
