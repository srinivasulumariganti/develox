<head>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #F0FDF4 0%, #FFFFFF 50%, #ECFDF5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loading-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669 0%, #10B981 100%);
      box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .loading-sub {
      font-size: 14px;
      color: #64748B;
      font-weight: 500;
      margin-bottom: 24px;
      text-align: center;
      max-width: 320px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">🥗</div>
    <div class="loading-title">Doctor's Diet AI</div>
    <div class="loading-sub">Loading your personalized nutrition assistant...</div>
    <div class="spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.dietSpeech = {
      recognition: null,
      isListening: false,
      startRecognition: function(lang, onResult, onError, onEnd) {
        var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError("Microphone speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
          return;
        }
        try {
          if (this.recognition) {
            try { this.recognition.abort(); } catch(e){}
          }
          var rec = new SpeechRec();
          rec.lang = lang || 'en-IN';
          rec.continuous = false;
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          rec.onresult = function(event) {
            if (event.results && event.results.length > 0 && event.results[0].length > 0) {
              var text = event.results[0][0].transcript;
              if (onResult) onResult(text);
            }
          };
          rec.onerror = function(event) {
            var err = event.error || "Speech recognition error";
            if (err === 'not-allowed' || err === 'permission-denied') {
              err = "Microphone access was denied. Please allow microphone permission in your browser address bar.";
            } else if (err === 'no-speech') {
              err = "No speech detected. Please tap mic and speak clearly.";
            } else if (err === 'network') {
              err = "Network error during speech recognition. Please check your internet connection.";
            }
            if (onError) onError(err);
          };
          rec.onend = function() {
            window.dietSpeech.isListening = false;
            if (onEnd) onEnd();
          };
          rec.start();
          this.recognition = rec;
          this.isListening = true;
        } catch(e) {
          this.isListening = false;
          if (onError) onError(e.message || "Failed to start microphone. Please check browser permissions.");
        }
      },
      stopRecognition: function() {
        if (this.recognition) {
          try { this.recognition.stop(); } catch(e){}
          this.isListening = false;
        }
      },
      speak: function(text, lang, onEnd) {
        if (!window.speechSynthesis) return;
        try { window.speechSynthesis.cancel(); } catch(e){}
        // Strip ALL emojis and markdown formatting so TTS engine NEVER speaks emojis
        var clean = text
          .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{FE00}-\u{FE0F}]/gu, '')
          .replace(/[|•*#`~_>]/g, ' ')
          .replace(/[-]{2,}/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        var utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = lang || 'en-IN';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.onend = function() {
          if (onEnd) {
            try { onEnd(); } catch(e){}
          }
        };
        utterance.onerror = function() {
          if (onEnd) {
            try { onEnd(); } catch(e){}
          }
        };
        window.speechSynthesis.speak(utterance);
      },
      stopSpeaking: function() {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      }
    };

    // Global top-level bindings for direct JS interop
    window.dietStartRecognition = function(lang, onResult, onError, onEnd) {
      window.dietSpeech.startRecognition(lang, onResult, onError, onEnd);
    };
    window.dietStopRecognition = function() {
      window.dietSpeech.stopRecognition();
    };
    window.dietSpeak = function(text, lang, onEnd) {
      window.dietSpeech.speak(text, lang, onEnd);
    };
    window.dietStopSpeaking = function() {
      window.dietSpeech.stopSpeaking();
    };

    // Also alias dotted properties so any lookup style succeeds
    window['dietSpeech.startRecognition'] = window.dietStartRecognition;
    window['dietSpeech.stopRecognition'] = window.dietStopRecognition;
    window['dietSpeech.speak'] = window.dietSpeak;
    window['dietSpeech.stopSpeaking'] = window.dietStopSpeaking;

    // Doctor's Diet Web Alarm & Reminder Engine (PWA & Web)
    window.dietAlarm = {
      _timers: {},
      requestPermission: async function() {
        if (!("Notification" in window)) return 'unsupported';
        try {
          if (Notification.permission === 'default') {
            return await Notification.requestPermission();
          }
          return Notification.permission;
        } catch(e) {
          return 'denied';
        }
      },
      playChime: function(type) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          var now = ctx.currentTime;
          var notes = type === 'water' ? [587.33, 880.00] : [523.25, 659.25, 783.99, 1046.50];
          notes.forEach(function(freq, i) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = type === 'water' ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.16);
            gain.gain.setValueAtTime(0.001, now + i * 0.16);
            gain.gain.linearRampToValueAtTime(0.35, now + i * 0.16 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.16 + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.16);
            osc.stop(now + i * 0.16 + 0.46);
          });
        } catch(e) {
          console.warn('Diet alarm audio chime note:', e);
        }
      },
      showNotification: function(title, body) {
        try {
          if ("Notification" in window && Notification.permission === "granted") {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
              navigator.serviceWorker.ready.then(function(reg) {
                reg.showNotification(title, {
                  body: body,
                  icon: 'favicon.png',
                  badge: 'favicon.png',
                  vibrate: [200, 100, 200],
                  tag: 'diet-alarm-' + Date.now(),
                  renotify: true
                });
              });
            } else {
              new Notification(title, {
                body: body,
                icon: 'favicon.png'
              });
            }
          }
        } catch(e) {
          console.warn('Diet notification error:', e);
        }
      },
      scheduleAlarm: function(title, hour, minute) {
        var self = this;
        this.requestPermission();
        var now = new Date();
        var target = new Date();
        target.setHours(parseInt(hour, 10), parseInt(minute, 10), 0, 0);
        if (target.getTime() <= now.getTime()) {
          target.setDate(target.getDate() + 1);
        }
        var delayMs = target.getTime() - now.getTime();
        var key = 'meal_' + title;
        if (this._timers[key]) {
          clearTimeout(this._timers[key]);
        }
        this._timers[key] = setTimeout(function() {
          self.playChime('meal');
          self.showNotification("⏰ Doctor's Diet: " + title, "Time for your scheduled " + title + "! Eat healthy and stay consistent.");
          self._timers[key] = setInterval(function() {
            self.playChime('meal');
            self.showNotification("⏰ Doctor's Diet: " + title, "Time for your scheduled " + title + "!");
          }, 24 * 60 * 60 * 1000);
        }, delayMs);
        this.playChime('meal');
        return true;
      },
      scheduleTimer: function(seconds, title) {
        var self = this;
        this.requestPermission();
        var sec = parseInt(seconds, 10) || 7200;
        var key = 'timer_water';
        if (this._timers[key]) {
          clearTimeout(this._timers[key]);
        }
        this._timers[key] = setTimeout(function() {
          self.playChime('water');
          self.showNotification("💧 Doctor's Diet: Hydration Reminder", "Drink a glass of water now to stay refreshed and maintain good digestion!");
          self._timers[key] = setInterval(function() {
            self.playChime('water');
            self.showNotification("💧 Doctor's Diet: Hydration Reminder", "Time to hydrate! Drink a glass of water.");
          }, sec * 1000);
        }, sec * 1000);
        this.playChime('water');
        return true;
      },
      openCalendar: function(title, hour, minute) {
        try {
          var now = new Date();
          var start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(hour, 10), parseInt(minute, 10));
          if (start.getTime() <= now.getTime()) {
            start.setDate(start.getDate() + 1);
          }
          var end = new Date(start.getTime() + 30 * 60000);
          function fmt(d) {
            return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
          }
          var url = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
            "&text=" + encodeURIComponent("Doctor's Diet: " + title) +
            "&dates=" + fmt(start) + "/" + fmt(end) +
            "&details=" + encodeURIComponent("Personalized diet meal reminder from Doctor's Diet AI app.") +
            "&recur=RRULE:FREQ=DAILY";
          window.open(url, '_blank');
        } catch(e) {}
      }
    };

    window.dietScheduleAlarm = function(title, hour, minute) {
      return window.dietAlarm.scheduleAlarm(title, hour, minute);
    };
    window.dietScheduleTimer = function(seconds, title) {
      return window.dietAlarm.scheduleTimer(seconds, title);
    };
    window.dietRequestAlarmPermission = function() {
      return window.dietAlarm.requestPermission();
    };
    window.dietOpenCalendar = function(title, hour, minute) {
      return window.dietAlarm.openCalendar(title, hour, minute);
    };


    // Smoothly remove loading screen on first Flutter frame or fallback timeout
    function hideLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingScreen);
    // Safety fallback in case event is missed
    setTimeout(hideLoadingScreen, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
